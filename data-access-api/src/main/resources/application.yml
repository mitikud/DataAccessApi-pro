server:
  port: 8081

spring:
  application:
    name: data-access-api

  datasource:
    url: jdbc:postgresql://localhost:5432/data_access_db
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true